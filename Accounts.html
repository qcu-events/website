<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | QCU EVENTS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .acct {
            display: flex;
            min-height: 100vh;
            background: #fffcfa;
        }

        .side {
            width: 240px;
            padding: 20px;
            border-right: 1px solid #e9ded7;
        }

        .side a {
            display: block;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .side a:hover,
        .side a.active {
            background: #f1dcd2;
        }

        .main {
            flex: 1;
            padding: 30px 40px;
            max-width: 760px;
        }

        .main h1 {
            margin-bottom: 20px;
        }

        .main section {
            padding: 20px 0;
            border-bottom: 1px solid #e9ded7;
        }

        .main label {
            display: block;
            font-weight: 600;
            margin: 12px 0 6px;
        }

        .main input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e9ded7;
            border-radius: 10px;
        }

        .btns {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #e9ded7;
            border-radius: 10px;
            background: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.save {
            background: #c98270;
            border-color: #c98270;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="acct">

        <aside class="side">
            <h3>Your account</h3>
            <a href="Accounts.html" class="active">Profile</a>
            <a href="History.html">History of Events</a>
            <a href="Registered.html">History of Registered Events</a>
            <a href="About.html">About</a>
            <a href="participantpage.html">← Back to QCU Events</a>
            <a href="index.html">Log Out</a>
        </aside>

        <main class="main">
            <h1>Account</h1>

            <form action="#" method="post">

                <section id="user">
                    <label for="first">First Name</label>
                    <input type="text" id="first" name="first">

                    <label for="last">Last Name</label>
                    <input type="text" id="last" name="last">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </section>

                <section id="password">
                    <h3>Password</h3>

                    <label for="current">Current Password</label>
                    <input type="password" id="current" name="current">

                    <label for="new">New Password</label>
                    <input type="password" id="new" name="new">

                    <label for="confirm">Confirm New Password</label>
                    <input type="password" id="confirm" name="confirm">
                </section>

                <div class="btns">
                    <a href="mainpage.html" class="btn">Cancel</a>
                    <button type="submit" class="btn save">Save</button>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
