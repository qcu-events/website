
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | QCU EVENTS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>QCU EVENTS</h1>
    </header>

    <main>
        <div class="card">
            <h2>Create an Account</h2>
            <p>Join QCU EVENTS and discover campus activities.</p>

            <form action="#" method="post">
                <label for="Student ID">&#128100; Your Student ID</label>
                <input type="Student ID" id="StudentID" name="StudentID"
                       placeholder="Enter your Student ID" required>

                <label for="email">&#9993; Your Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="password">&#128274; Create Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>

                <button type="submit">Sign Up &#8594;</button>
            </form>

            <div class="signup-area">
                <p>Already have an account?</p>
                <a href="participantlogin.html">
                    <button type="button">Log In</button>
                </a>
                <p><a href="html.html">Back to Home</a></p>
            </div>
        </div>
    </main>

</body>
</html>
